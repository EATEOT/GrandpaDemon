name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: ""
          - name: Android
            os: ubuntu-latest
            target: "Android"

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/setup-geode@main

      - name: Build Mod
        run: |
          if [ "${{ matrix.config.name }}" = "Windows" ]; then
            geode build . --release
          else
            geode build . --release --target Android
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandpaDemon-${{ matrix.config.name }}
          path: "build/**/*.geode"
